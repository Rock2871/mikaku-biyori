{% extends 'base.html' %}
{% block content %}
  <div class="text-center">
    <p>あなた好みのコーヒー豆を簡単診断！</p>
    <a href="{{ url_for('diagnosis') }}" class="btn btn-primary">診断を始める</a>
  </div>
  <hr>
  <div class="row">
    {% for bean in beans %}
      <div class="col-md-4 mb-3">
        <div class="card p-3">
          <h5>{{ bean.name }}</h5>
          <p>{{ bean.description }}</p>
        </div>
      </div>
    {% endfor %}
  
  </div>
{% endblock %}
